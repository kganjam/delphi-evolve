[project]
name = "delphi-evolve"
version = "0.1.0"
description = "Query-to-certify route planning on the measured TrpB four-site landscape"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "matplotlib>=3.7"]
license = { text = "Apache-2.0" }

[project.optional-dependencies]
test = ["pytest", "rdflib>=7"]
evidence = ["rdflib>=7"]

[tool.setuptools.packages.find]
include = ["evolve*", "falsify*", "turing_scope*"]

[tool.setuptools.package-data]
falsify = ["static/*.html"]
turing_scope = ["sources/*", "examples/*"]

[project.scripts]
turing-scope-check = "falsify.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
